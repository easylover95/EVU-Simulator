[package]
name = "evu-simulator"
version = "0.1.0"
description = "EVU Simulator — Eisenbahnlogistik Management"
authors = ["EVU Simulator"]
edition = "2021"

[lib]
name = "evu_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
